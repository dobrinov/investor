[package]
name = "investor-desktop"
version = "0.4.0"
description = "Investor as a desktop app for Windows, macOS and Linux"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/dobrinov/investor"
publish = false

# Its own workspace: the web view and its system libraries stay out of the
# core's builds and tests.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
percent-encoding = "2"
tiny_http = "0.12"
tauri-plugin-updater = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
