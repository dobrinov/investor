name: Desktop app

# Builds the desktop app for Windows, macOS and Linux and attaches the
# installers to a GitHub release. Push a tag such as v0.1.0 to release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ''
            targets: wasm32-unknown-unknown
          - os: windows-latest
            args: ''
            targets: wasm32-unknown-unknown
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Linux libraries for the web view
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Run package scripts with Git Bash on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: pnpm config set script-shell "C:\\Program Files\\Git\\bin\\bash.exe"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: npx --yes @tauri-apps/cli@2.12.4
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Investor ${{ github.ref_name }}
          releaseBody: |
            Investor for your own computer. Download the file for your system below:

            - **Windows**: the `.msi` or `-setup.exe` file
            - **macOS** (Apple silicon and Intel): the `.dmg` file
            - **Linux**: the `.AppImage`, `.deb` or `.rpm` file

            The app is not signed yet, so your system will warn the first time you open it.
            On macOS, right-click the app, choose Open, then Open again. On Windows, choose
            More info, then Run anyway.

            Your portfolio stays in your .invest file; the app never connects to the internet.
          releaseDraft: false
          prerelease: false
