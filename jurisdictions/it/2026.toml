notes = { en = "Draft rules. 26% substitute tax on gains and dividends (12.5% on Italian and white-list government bonds, not modelled). With a foreign broker you declare gains in quadro RT and pay IVAFE, 0.2% a year on the value of foreign holdings, in quadro RW.", it = "Regole provvisorie. Imposta sostitutiva del 26 % su plusvalenze e dividendi (12,5 % sui titoli di Stato italiani e white list, non modellato). Con un broker estero dichiari le plusvalenze nel quadro RT e paghi l’IVAFE, lo 0,2 % annuo sul valore delle attività estere, nel quadro RW." }

