[pack]
id = "de-bzst"
version = "2026.1"
country = "DE"
authority = "Bundeszentralamt für Steuern / Finanzamt"
website = "https://www.elster.de"
tax_year = 2026
currency = "EUR"
verified = false
notes = "Draft rules. Abgeltungsteuer 25% plus 5.5% solidarity surcharge (26.375%); church tax, if you pay it, comes on top. The Sparer-Pauschbetrag (EUR 1,000 single, EUR 2,000 joint) covers gains and dividends together; this uses EUR 1,000 for gains only. Equity ETFs get a 30% partial exemption (Teilfreistellung) not modelled here. German brokers withhold the tax; gains at foreign brokers go on Anlage KAP."

[capital_gains]
rate = "0.26375"
form = "Anlage KAP (and KAP-INV for funds)"
annual_exempt_amount = "1000"

[dividends]
rate = "0.26375"
form = "Anlage KAP"
foreign_tax_credit = true

[physical_metals]
# Coins and bars. UNVERIFIED.
treatment = "other"
exempt_after_months = 12
note = "Private sale (§ 23 EStG): tax-free after one year; within a year the gain is taxed at your personal income tax rate, with a EUR 1,000 exemption limit for all such sales. Not estimated here."

[deadlines]
