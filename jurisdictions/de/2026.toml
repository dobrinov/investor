notes = { en = "Draft rules. Abgeltungsteuer 25% plus 5.5% solidarity surcharge (26.375%); church tax, if you pay it, comes on top. The Sparer-Pauschbetrag (EUR 1,000 single, EUR 2,000 joint) covers gains and dividends together; this uses EUR 1,000 for gains only. Equity ETFs get a 30% partial exemption (Teilfreistellung) not modelled here. German brokers withhold the tax; gains at foreign brokers go on Anlage KAP.", de = "Entwurf. Abgeltungsteuer 25 % plus 5,5 % Solidaritätszuschlag (26,375 %); Kirchensteuer, falls Sie sie zahlen, kommt hinzu. Der Sparer-Pauschbetrag (1.000 € allein, 2.000 € zusammen veranlagt) gilt für Gewinne und Dividenden zusammen; hier werden 1.000 € nur für Gewinne angesetzt. Die Teilfreistellung von 30 % für Aktien-ETFs ist nicht abgebildet. Deutsche Broker behalten die Steuer ein; Gewinne bei ausländischen Brokern gehören in die Anlage KAP." }

